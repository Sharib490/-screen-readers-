<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile‑First Dashboard</title>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="min-h-screen bg-base-200">
{{{> header }}}


<div class="flex min-h-[calc(100vh-64px)]">
{{{> sidebar }}}


<main id="main-content" class="flex-1 p-4">
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
{{#each widgets}}
<div class="card p-4 shadow-sm">
<h3 class="text-lg font-semibold">{{title}}</h3>
<p class="text-sm">{{description}}</p>
</div>
{{/each}}
</section>
</main>
</div>


<script src="/assets/js/app.js"></script>
</body>
</html>

<header class="h-16 flex items-center px-4 bg-white shadow z-40">
<button id="hamburger" aria-controls="sidebar" aria-expanded="false" class="p-2 rounded-md focus:outline focus:ring">
<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
<span class="sr-only">Toggle navigation</span>
</button>
<h1 class="ml-3 text-xl font-medium">Dashboard</h1>
</header>

<nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-base-100 border-r transform -translate-x-full sm:translate-x-0 transition-transform" aria-label="Main navigation">
<div class="p-4">
<div class="mb-4 font-bold">My App</div>
<ul class="space-y-2">
{{#each nav}}
<li>
<a href="{{url}}" class="flex items-center gap-3 p-2 rounded-md hover:bg-base-200" aria-current="{{#if active}}page{{/if}}">
<span class="icon">{{icon}}</span>
<span class="label hidden sm:inline">{{label}}</span>
</a>
</li>
{{/each}}
</ul>
</div>
</nav>
